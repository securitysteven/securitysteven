name: Update Profile Metrics
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch GitHub stats
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const username = '${{ github.repository_owner }}';
            const { data: user } = await github.rest.users.getByUsername({ username });

            const { data: repos } = await github.rest.repos.listForUser({
              username,
              per_page: 100
            });

            const publicRepos = repos.filter(repo => !repo.private && !repo.fork);

            const totalStars = publicRepos.reduce((sum, repo) => sum + (repo.stargazers_count || 0), 0);

            const readme = fs.readFileSync('README.md', 'utf8');
            const sections = [];
            let currentSection = null;

            for (const line of readme.split(/\r?\n/)) {
              const heading = line.match(/^##\s+(.+)$/);
              if (heading) {
                currentSection = { name: heading[1].trim(), repositories: [] };
                sections.push(currentSection);
                continue;
              }

              if (!currentSection) continue;

              const match = line.match(/\[[^\]]+\]\((https:\/\/github\.com\/[^)]+)\)/);
              if (!match) continue;

              const url = new URL(match[1]);
              const pathSegments = url.pathname.split('/').filter(Boolean);
              const [owner, repoName] = pathSegments;

              if (
                owner &&
                repoName &&
                owner.toLowerCase() === username.toLowerCase() &&
                publicRepos.some(repo => repo.name === repoName)
              ) {
                currentSection.repositories.push({ name: repoName });
              }
            }

            const stats = {
              name: user.name || user.login,
              avatar: user.avatar_url,
              public_repos: publicRepos.length,
              followers: user.followers,
              totalStars,
              sections: sections.filter(section => section.repositories.length > 0)
            };

            fs.writeFileSync('stats.json', JSON.stringify(stats), 'utf8');

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate metrics SVG
        run: node svg-generator.js
        env:
          STATS_FILE: stats.json

      - name: Commit and push metrics
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/metrics.svg
          if git diff --cached --quiet; then
            echo "No metrics changes to commit."
            exit 0
          fi
          git commit -m "Update metrics.svg"
          git push
