<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Steven | Security, automation, open source</title>
  <desc id="description">A modern dark gradient banner for Steven's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1020" />
      <stop offset="1" stop-color="#171d36" />
    </linearGradient>
    <linearGradient id="glow" x1="300" y1="40" x2="1000" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b7bff" />
      <stop offset="1" stop-color="#43d9c5" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a8b4d0" stroke-opacity=".07" />
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)" />
  <rect width="1200" height="300" rx="28" fill="url(#grid)" />
  <circle cx="1000" cy="50" r="190" fill="#8b7bff" fill-opacity=".13" />
  <circle cx="1100" cy="250" r="180" fill="#43d9c5" fill-opacity=".09" />
  <path d="M0 245C235 185 360 295 595 228s348-137 605-65" fill="none" stroke="url(#glow)" stroke-opacity=".42" stroke-width="2" />
  <rect x="72" y="66" width="8" height="168" rx="4" fill="url(#glow)" />
  <text x="112" y="126" fill="#f4f6ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="750" letter-spacing="-1.6">SECURITY,</text>
  <text x="112" y="185" fill="#f4f6ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="750" letter-spacing="-1.6">BUILT WITH CURIOSITY.</text>
  <text x="116" y="224" fill="#aeb9d2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="500" letter-spacing="2.2">CYBERSECURITY  /  AUTOMATION  /  OPEN SOURCE</text>
  <circle cx="1057" cy="147" r="63" fill="#111a2e" fill-opacity=".7" stroke="url(#glow)" stroke-opacity=".8" stroke-width="1.5" />
  <path d="M1057 103 1090 116v26c0 25-16 42-33 51-17-9-33-26-33-51v-26l33-13Z" fill="none" stroke="url(#glow)" stroke-width="3" stroke-linejoin="round" />
  <path d="m1043 145 10 10 20-23" fill="none" stroke="#e9f2ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
